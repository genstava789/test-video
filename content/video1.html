<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - MovieFlix</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Iframely -->
    <script async src="//cdn.iframe.ly/embed.js" charset="utf-8"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- Header with Navigation -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-gray-900/95 backdrop-blur-sm">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <a href="../" class="text-2xl font-bold hover:text-red-500 transition-colors">MovieFlix</a>
            <button id="hamburger" class="text-2xl p-2 hover:text-red-500 transition-colors" aria-label="Toggle Navigation">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed top-0 right-0 w-64 h-full bg-gray-800/95 backdrop-blur-sm transform translate-x-full transition-transform duration-300 z-50">
        <div class="p-6">
            <button id="close-sidebar" class="absolute top-4 right-4 text-2xl p-2 hover:text-red-500 transition-colors">
                <i class="fas fa-times"></i>
            </button>
            <nav class="mt-8">
                <ul class="space-y-4">
                    <li><a href="../" class="block py-2 hover:text-red-500 transition-colors">Home</a></li>
                    <li><a href="../#trending" class="block py-2 hover:text-red-500 transition-colors">Trending</a></li>
                    <li><a href="../#popular" class="block py-2 hover:text-red-500 transition-colors">Popular</a></li>
                    <li><a href="../#recently-added" class="block py-2 hover:text-red-500 transition-colors">Recently Added</a></li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="min-h-screen pt-16">
        <!-- Movie Details -->
        <div class="relative">
            <!-- Backdrop Image -->
            <div id="movie-backdrop" class="absolute inset-0 h-[50vh] md:h-[70vh] bg-cover bg-center"></div>
            <div class="absolute inset-0 h-[50vh] md:h-[70vh] bg-gradient-to-t from-gray-900 via-gray-900/70 to-transparent"></div>

            <!-- Content -->
            <div class="relative container mx-auto px-4 pt-[35vh] md:pt-[50vh]">
                <div class="bg-gray-900/95 backdrop-blur-sm rounded-t-3xl -mt-8 shadow-2xl">
                    <div class="p-6 md:p-8 space-y-6 md:space-y-8">
                        <!-- Title and Meta -->
                        <div>
                            <h1 id="movie-title" class="text-3xl md:text-4xl lg:text-5xl font-bold mb-4"></h1>
                            <div class="flex flex-wrap items-center gap-4 text-sm md:text-base text-gray-300">
                                <div id="movie-year"></div>
                                <div id="movie-runtime"></div>
                                <div class="flex items-center">
                                    <i class="fas fa-star text-yellow-400 mr-1"></i>
                                    <span id="movie-rating"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Overview -->
                        <div>
                            <p id="movie-overview" class="text-base md:text-lg leading-relaxed text-gray-300"></p>
                        </div>

                        <!-- Genres -->
                        <div>
                            <h3 class="text-xl font-semibold mb-3">Genres</h3>
                            <div id="movie-genres" class="flex flex-wrap gap-2"></div>
                        </div>

                        <!-- Cast -->
                        <div>
                            <h3 class="text-xl font-semibold mb-3">Cast</h3>
                            <div class="relative">
                                <div id="movie-cast" class="flex overflow-x-auto space-x-4 pb-4 scrollbar-hide"></div>
                                <div class="absolute right-0 top-0 bottom-4 w-12 bg-gradient-to-l from-gray-900 pointer-events-none"></div>
                            </div>
                        </div>

                        <!-- Trailer -->
                        <div>
                            <h3 class="text-xl font-semibold mb-4">Trailer</h3>
                            <div id="movie-trailer" class="aspect-video rounded-lg overflow-hidden bg-gray-800 shadow-lg"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Error Message -->
    <div id="error-message" class="fixed bottom-4 right-4 bg-red-600 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-full opacity-0 transition-all duration-300">
        Failed to load movie details. Please try again later.
    </div>

    <!-- Scripts -->
    <script src="../config.js"></script>
    <script src="../assets/app.js"></script>
    <script src="video1-script.js" type="module"></script>
</body>
</html>
