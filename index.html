<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white">
    <!-- Header with Navigation -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-gray-900/95 backdrop-blur-sm border-b border-gray-800/50">
        <div class="container mx-auto px-4 py-3 sm:py-4 flex items-center justify-between">
            <a href="/" class="text-xl sm:text-2xl font-bold hover:text-red-500 transition-colors">MovieFlix</a>
            
            <!-- Desktop Navigation -->
            <nav class="hidden lg:block">
                <ul class="flex items-center space-x-8">
                    <li><a href="/" class="font-medium hover:text-red-500 transition-colors duration-300 relative after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 hover:after:w-full after:bg-red-500 after:transition-all after:duration-300">Home</a></li>
                    <li><a href="#recently-added" class="font-medium hover:text-red-500 transition-colors duration-300 relative after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 hover:after:w-full after:bg-red-500 after:transition-all after:duration-300">Recently Added</a></li>
                    <li><a href="#trending" class="font-medium hover:text-red-500 transition-colors duration-300 relative after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 hover:after:w-full after:bg-red-500 after:transition-all after:duration-300">Trending</a></li>
                    <li><a href="#popular" class="font-medium hover:text-red-500 transition-colors duration-300 relative after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 hover:after:w-full after:bg-red-500 after:transition-all after:duration-300">Popular</a></li>
                </ul>
            </nav>
            
            <!-- Mobile Menu Button -->
            <button id="hamburger" class="p-2 hover:bg-gray-800 rounded-lg transition-colors duration-300 lg:hidden" aria-label="Toggle Navigation">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </div>
    </header>

    <!-- Mobile Sidebar -->
    <aside id="sidebar" class="fixed top-0 right-0 w-72 h-full bg-gray-900/95 backdrop-blur-sm transform translate-x-full transition-all duration-300 ease-in-out z-50 lg:hidden shadow-xl">
        <div class="flex flex-col h-full">
            <div class="flex items-center justify-between p-4 border-b border-gray-800">
                <h2 class="text-xl font-bold">Menu</h2>
                <button id="close-sidebar" class="p-2 hover:bg-gray-800 rounded-lg transition-colors duration-300">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <nav class="flex-1 p-4">
                <ul class="space-y-2">
                    <li><a href="/" class="block px-4 py-2.5 rounded-lg hover:bg-gray-800 hover:text-red-500 transition-all duration-300">Home</a></li>
                    <li><a href="#recently-added" class="block px-4 py-2.5 rounded-lg hover:bg-gray-800 hover:text-red-500 transition-all duration-300">Recently Added</a></li>
                    <li><a href="#trending" class="block px-4 py-2.5 rounded-lg hover:bg-gray-800 hover:text-red-500 transition-all duration-300">Trending</a></li>
                    <li><a href="#popular" class="block px-4 py-2.5 rounded-lg hover:bg-gray-800 hover:text-red-500 transition-all duration-300">Popular</a></li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="container mx-auto px-4 pt-16 lg:pt-20">
        <!-- Featured Content -->
        <section class="relative h-[50vh] sm:h-[60vh] lg:h-[70vh] rounded-lg lg:rounded-xl overflow-hidden mb-8 lg:mb-16">
            <div id="hero-movie" class="absolute inset-0 bg-cover bg-center bg-no-repeat"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/80 to-transparent"></div>
            <div class="absolute inset-0 bg-gradient-to-r from-gray-900/90 to-transparent"></div>
            <div class="absolute bottom-0 left-0 right-0 p-4 sm:p-6 lg:p-8">
                <div class="container mx-auto max-w-screen-xl">
                    <div class="max-w-2xl">
                        <span class="inline-block px-2 py-1 sm:px-3 sm:py-1.5 bg-red-600 text-xs sm:text-sm font-medium rounded-md mb-2 sm:mb-3 lg:mb-4 shadow-lg">Featured</span>
                        <h2 id="hero-title" class="text-2xl sm:text-3xl lg:text-5xl font-bold mb-2 sm:mb-3 lg:mb-4 drop-shadow-lg line-clamp-2"></h2>
                        <p id="hero-overview" class="text-sm sm:text-base lg:text-lg max-w-xl lg:max-w-2xl mb-4 sm:mb-6 lg:mb-8 leading-relaxed text-gray-200 line-clamp-2 sm:line-clamp-3"></p>
                        <button class="bg-red-600 hover:bg-red-700 px-4 sm:px-6 py-2 sm:py-3 rounded-lg font-semibold transition-all duration-300 hover:scale-105 hover:shadow-xl hover:shadow-red-600/20 flex items-center space-x-2 text-sm sm:text-base">
                            <div class="w-6 h-6 sm:w-7 sm:h-7 bg-white rounded-full flex items-center justify-center">
                                <i class="fas fa-play text-red-600 text-xs sm:text-sm ml-0.5"></i>
                            </div>
                            <span>Watch Trailer</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Movie Sections -->
        <div class="space-y-8 lg:space-y-16">
            <!-- Trending Movies Section -->
            <section id="trending">
                <h3 class="text-xl lg:text-2xl font-bold mb-4 lg:mb-6 px-1">Trending Now</h3>
                <div class="overflow-x-auto pb-6 -mx-4 px-4 touch-pan-x scrollbar-hide">
                    <div class="swiper trending-swiper movie-slider flex space-x-3 lg:space-x-4">
                        <div class="swiper-wrapper">
                            <!-- Movies will be inserted here by JavaScript -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Recently Added Section -->
            <section id="recently-added">
                <h3 class="text-xl lg:text-2xl font-bold mb-4 lg:mb-6 px-1">Recently Added</h3>
                <div class="overflow-x-auto pb-6 -mx-4 px-4 touch-pan-x scrollbar-hide">
                    <div class="swiper recently-added-swiper movie-slider flex space-x-3 lg:space-x-4">
                        <div class="swiper-wrapper">
                            <!-- Recently added content will be inserted here by JavaScript -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Popular Movies Section -->
            <section id="popular">
                <h3 class="text-xl lg:text-2xl font-bold mb-4 lg:mb-6 px-1">Popular Movies</h3>
                <div class="overflow-x-auto pb-6 -mx-4 px-4 touch-pan-x scrollbar-hide">
                    <div class="swiper popular-swiper movie-slider flex space-x-3 lg:space-x-4">
                        <div class="swiper-wrapper">
                            <!-- Movies will be inserted here by JavaScript -->
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Error Message -->
    <div id="error-message" class="fixed bottom-4 right-4 bg-red-600 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-full opacity-0 transition-all duration-300">
        Failed to load movies. Please try again later.
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <!-- Config -->
    <script src="config.js"></script>
    <!-- Custom JS -->
    <script src="assets/app.js" type="module"></script>
</body>
</html>
