<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white">
    <!-- Header with Navigation -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-gray-900/95 backdrop-blur-sm">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-2xl font-bold">MovieFlix</h1>
            <button id="hamburger" class="text-2xl" aria-label="Toggle Navigation">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed top-0 right-0 w-64 h-full bg-gray-800/95 backdrop-blur-sm transform translate-x-full transition-transform duration-300 z-50">
        <div class="p-6">
            <button id="close-sidebar" class="absolute top-4 right-4 text-2xl">
                <i class="fas fa-times"></i>
            </button>
            <nav class="mt-8">
                <ul class="space-y-4">
                    <li><a href="/" class="block py-2 hover:text-red-500 transition-colors">Home</a></li>
                    <li><a href="#recently-added" class="block py-2 hover:text-red-500 transition-colors">Recently Added</a></li>
                    <li><a href="#trending" class="block py-2 hover:text-red-500 transition-colors">Trending</a></li>
                    <li><a href="#popular" class="block py-2 hover:text-red-500 transition-colors">Popular</a></li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="container mx-auto px-4 pt-20">
        <!-- Featured Content -->
        <section class="relative h-[70vh] rounded-xl overflow-hidden mb-16">
            <div id="hero-movie" class="absolute inset-0 bg-cover bg-center"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/70 to-transparent"></div>
            <div class="absolute inset-0 bg-gradient-to-r from-gray-900/50 to-transparent"></div>
            <div class="absolute bottom-0 left-0 p-8 max-w-4xl">
                <span class="inline-block px-3 py-1.5 bg-red-600 text-sm font-medium rounded-md mb-4 shadow-lg">Featured</span>
                <h2 id="hero-title" class="text-4xl md:text-6xl font-bold mb-4 drop-shadow-lg"></h2>
                <p id="hero-overview" class="text-lg max-w-2xl mb-8 leading-relaxed text-gray-200"></p>
                <button class="bg-red-600 hover:bg-red-700 px-8 py-4 rounded-lg font-semibold transition-all duration-300 hover:scale-105 hover:shadow-xl hover:shadow-red-600/20 flex items-center space-x-2 group">
                    <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center">
                        <i class="fas fa-play text-red-600 text-sm ml-0.5"></i>
                    </div>
                    <span class="text-lg">Watch Trailer</span>
                </button>
            </div>
        </section>

        <!-- Trending Movies Section -->
        <section id="trending" class="mb-16">
            <h3 class="text-2xl font-bold mb-6">Trending Now</h3>
            <div class="overflow-x-auto pb-6 -mx-4 px-4 touch-pan-x">
                <div class="swiper trending-swiper movie-slider flex space-x-4">
                    <div class="swiper-wrapper">
                        <!-- Movies will be inserted here by JavaScript -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Recently Added Section -->
        <section id="recently-added" class="mb-16">
            <h3 class="text-2xl font-bold mb-6">Recently Added</h3>
            <div class="overflow-x-auto pb-6 -mx-4 px-4 touch-pan-x">
                <div class="swiper recently-added-swiper movie-slider flex space-x-4">
                    <div class="swiper-wrapper">
                        <!-- Recently added content will be inserted here by JavaScript -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Popular Movies Section -->
        <section id="popular" class="mb-16">
            <h3 class="text-2xl font-bold mb-6">Popular Movies</h3>
            <div class="overflow-x-auto pb-6 -mx-4 px-4 touch-pan-x">
                <div class="swiper popular-swiper movie-slider flex space-x-4">
                    <div class="swiper-wrapper">
                        <!-- Movies will be inserted here by JavaScript -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Error Message -->
    <div id="error-message" class="fixed bottom-4 right-4 bg-red-600 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-full opacity-0 transition-all duration-300">
        Failed to load movies. Please try again later.
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <!-- Config -->
    <script src="config.js"></script>
    <!-- Custom JS -->
    <script src="assets/app.js"></script>
</body>
</html>
